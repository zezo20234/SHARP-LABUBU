<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lock-In Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        // --- CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyAjeXycCBhYoAU-0iiC4LbSTylKrrThN8Y",
            authDomain: "sharplabubu.firebaseapp.com",
            databaseURL: "https://sharplabubu-default-rtdb.firebaseio.com",
            projectId: "sharplabubu",
            storageBucket: "sharplabubu.firebasestorage.app",
            messagingSenderId: "596148393481",
            appId: "1:596148393481:web:4f822d86c44a13bd810ad8"
        };
        
        // --- INITIALIZATION ---
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const genAI = new GoogleGenerativeAI("AQ.Ab8RN6IPi9NksyMQwwYnwOCwTgHR4tpp8wARqKCjMN_0qWAjsw");
        const today = new Date().toISOString().split('T')[0];

        // --- UI LOGIC ---
        document.getElementById('addBtn').onclick = async () => {
            const inputField = document.getElementById('foodInput');
            const input = inputField.value;
            if (!input) return;

            // Show loading state
            document.getElementById('addBtn').innerText = "Calculating...";

            try {
                const model = genAI.getGenerativeModel({ model: "gemini-pro" });
                const prompt = `Return only a number representing the calories for: ${input}. If you cannot determine it, return 0.`;
                const result = await model.generateContent(prompt);
                const calories = parseInt(result.response.text()) || 0;

                push(ref(db, `logs/${today}/foods`), { name: input, calories: calories });
                inputField.value = '';
            } catch (error) {
                console.error("Error connecting to AI:", error);
            } finally {
                document.getElementById('addBtn').innerText = "Add";
            }
        };

        // Listen for updates
        onValue(ref(db, `logs/${today}/foods`), (snapshot) => {
            const data = snapshot.val();
            let total = 0;
            const list = document.getElementById('foodList');
            list.innerHTML = '';
            
            for (let id in data) {
                total += data[id].calories;
                list.innerHTML += `<li class="bg-slate-700 p-3 rounded-lg flex justify-between">
                    <span>${data[id].name}</span>
                    <span class="font-bold text-blue-300">${data[id].calories} kcal</span>
                </li>`;
            }
            document.getElementById('totalCalories').innerText = total;
        });
    </script>
</head>
<body class="bg-slate-900 text-white p-6 min-h-screen">
    <h1 class="text-3xl font-bold mb-4">Lock-In Dashboard</h1>
    <div class="bg-slate-800 p-6 rounded-2xl mb-6 border border-slate-700">
        <h2 class="text-xl text-slate-400">Today's Intake</h2>
        <p class="text-5xl font-bold text-blue-400"><span id="totalCalories">0</span> kcal</p>
    </div>
    <div class="flex gap-2">
        <input id="foodInput" class="flex-1 p-3 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-blue-500" placeholder="What did you eat?">
        <button id="addBtn" class="bg-blue-600 px-6 py-3 rounded-lg font-bold hover:bg-blue-700 transition">Add</button>
    </div>
    <ul id="foodList" class="mt-6 space-y-2"></ul>
</body>
</html>
