<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Minecraft Economy Market</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#0f172a;
  color:white;
  min-height:100vh;
  padding:20px;
}

h1{
  text-align:center;
  margin-bottom:20px;
  font-size:38px;
}

.main{
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:20px;
}

.panel{
  background:#111827;
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;
  padding:20px;
}

.city-select{
  margin-bottom:20px;
}

select,input{
  width:100%;
  background:#1e293b;
  border:none;
  color:white;
  padding:14px;
  border-radius:12px;
  font-size:16px;
}

.search-wrap{
  position:relative;
}

.results{
  position:absolute;
  top:105%;
  left:0;
  width:100%;
  background:#020617;
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  overflow:hidden;
  display:none;
  z-index:100;
  max-height:400px;
  overflow-y:auto;
}

.result{
  padding:14px;
  border-bottom:1px solid rgba(255,255,255,.05);
  cursor:pointer;
  transition:.15s;
}

.result:hover{
  background:#1e293b;
}

.result-name{
  font-weight:600;
}

.result-price{
  color:#38bdf8;
  margin-top:4px;
  font-size:14px;
}

.item-box{
  margin-top:20px;
  background:#0b1220;
  border-radius:18px;
  padding:18px;
  display:none;
}

.item-box.active{
  display:block;
}

.item-title{
  font-size:28px;
  margin-bottom:10px;
}

.price{
  color:#22c55e;
  font-size:22px;
  font-weight:700;
}

.vat{
  color:#facc15;
  margin-top:6px;
}

.recommended{
  margin-top:16px;
  background:#1e293b;
  padding:14px;
  border-radius:14px;
}

.qty-row{
  margin-top:18px;
}

button{
  margin-top:15px;
  width:100%;
  border:none;
  background:#38bdf8;
  color:black;
  font-weight:700;
  padding:14px;
  border-radius:14px;
  cursor:pointer;
  font-size:16px;
}

.cart-item{
  padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.cart-item-name{
  font-weight:600;
}

.cart-item-meta{
  color:#94a3b8;
  font-size:14px;
}

.total{
  margin-top:20px;
  padding-top:20px;
  border-top:2px solid rgba(255,255,255,.08);
}

.total-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.grand{
  color:#38bdf8;
  font-size:24px;
  font-weight:700;
}

@media(max-width:900px){
  .main{
    grid-template-columns:1fr;
  }
}
</style>
</head>
<body>

<h1>Minecraft Economy Market</h1>

<div class="main">

<div class="panel">

<div class="city-select">
<select id="city">
<option>Barcelona</option>
<option>Madrid</option>
</select>
</div>

<div class="search-wrap">
<input type="text" id="search" placeholder="Search item... Example: dia, iron, bread"/>
<div class="results" id="results"></div>
</div>

<div class="item-box" id="itemBox">

<div class="item-title" id="itemName"></div>

<div class="price" id="price"></div>

<div class="vat" id="vat"></div>

<div style="margin-top:12px;" id="unit"></div>

<div class="recommended">
<div><b>Recommended Selling Price:</b></div>
<div id="recommended"></div>
</div>

<div class="qty-row">
<input type="number" id="qty" min="1" value="1">
</div>

<button id="addBtn">ADD TO CART</button>

</div>

</div>

<div class="panel">

<h2>Cart</h2>

<div id="cart"></div>

<div class="total">

<div class="total-row">
<div>Subtotal</div>
<div id="subtotal">0€</div>
</div>

<div class="total-row">
<div>VAT</div>
<div id="vatTotal">0€</div>
</div>

<div class="total-row grand">
<div>Total</div>
<div id="grand">0€</div>
</div>

</div>

</div>

</div>

<script>

const VAT = 0.10;

const items = [

{name:"Diamond",barca:45,madrid:34,unit:"1 diamond",sellB:52,sellM:40},
{name:"Diamond Block",barca:390,madrid:320,unit:"1 block",sellB:430,sellM:360},
{name:"Iron Ingot",barca:8,madrid:6,unit:"1 ingot",sellB:10,sellM:8},
{name:"Gold Ingot",barca:15,madrid:12,unit:"1 ingot",sellB:18,sellM:15},
{name:"Emerald",barca:20,madrid:16,unit:"1 emerald",sellB:24,sellM:20},
{name:"Bread",barca:3,madrid:2,unit:"1 bread",sellB:4,sellM:3},
{name:"Cooked Beef",barca:7,madrid:5,unit:"1 steak",sellB:9,sellM:7},
{name:"Cooked Chicken",barca:5,madrid:4,unit:"1 chicken",sellB:7,sellM:5},
{name:"Concrete",barca:8,madrid:6,unit:"Stack of 64",sellB:11,sellM:9},
{name:"Glass",barca:3,madrid:2,unit:"Stack of 64",sellB:5,sellM:4},
{name:"Oak Planks",barca:2,madrid:1,unit:"Stack of 64",sellB:4,sellM:3},
{name:"Stone",barca:2,madrid:1,unit:"Stack of 64",sellB:4,sellM:3},
{name:"Cobblestone",barca:2,madrid:1,unit:"Stack of 64",sellB:4,sellM:3},
{name:"Iron Pickaxe",barca:20,madrid:17,unit:"1 pickaxe",sellB:25,sellM:21},
{name:"Diamond Pickaxe",barca:50,madrid:42,unit:"1 pickaxe",sellB:60,sellM:50},
{name:"Netherite Pickaxe",barca:150,madrid:127,unit:"1 pickaxe",sellB:175,sellM:145},
{name:"Cake",barca:20,madrid:17,unit:"1 cake",sellB:25,sellM:20},
{name:"Apple",barca:2,madrid:1,unit:"1 apple",sellB:3,sellM:2},
{name:"Carrot",barca:2,madrid:1,unit:"1 carrot",sellB:3,sellM:2},
{name:"Potato",barca:1,madrid:1,unit:"1 potato",sellB:2,sellM:2},
{name:"Pumpkin Pie",barca:5,madrid:4,unit:"1 pie",sellB:7,sellM:5},
{name:"Taxi Ride",barca:15,madrid:12,unit:"1 ride",sellB:18,sellM:15},
{name:"Metro Ticket",barca:8,madrid:6,unit:"1 ticket",sellB:10,sellM:8},
{name:"Train Ticket",barca:150,madrid:127,unit:"1 ticket",sellB:170,sellM:145},
{name:"Small House",barca:400,madrid:340,unit:"1 house",sellB:450,sellM:390},
{name:"Mansion",barca:3000,madrid:2550,unit:"1 mansion",sellB:3400,sellM:2900},
{name:"Beacon",barca:250,madrid:212,unit:"1 beacon",sellB:290,sellM:240},
{name:"Netherite Ingot",barca:250,madrid:212,unit:"1 ingot",sellB:290,sellM:240},
{name:"Elytra",barca:200,madrid:170,unit:"1 elytra",sellB:240,sellM:200},
{name:"Shulker Box",barca:35,madrid:29,unit:"1 shulker",sellB:42,sellM:35}

];

const search = document.getElementById("search");
const results = document.getElementById("results");
const city = document.getElementById("city");

const itemBox = document.getElementById("itemBox");
const itemName = document.getElementById("itemName");
const price = document.getElementById("price");
const vat = document.getElementById("vat");
const unit = document.getElementById("unit");
const recommended = document.getElementById("recommended");
const qty = document.getElementById("qty");

const cartDiv = document.getElementById("cart");

let current = null;
let cart = [];

function money(v){
  return v.toFixed(2)+"€";
}

function showResults(){

  const q = search.value.toLowerCase().trim();

  results.innerHTML = "";

  if(!q){
    results.style.display="none";
    return;
  }

  const filtered = items.filter(i =>
    i.name.toLowerCase().includes(q)
  );

  if(filtered.length===0){
    results.style.display="none";
    return;
  }

  filtered.forEach(i=>{

    const div = document.createElement("div");
    div.className="result";

    const p = city.value==="Barcelona" ? i.barca : i.madrid;

    div.innerHTML = `
      <div class="result-name">${i.name}</div>
      <div class="result-price">${money(p)}</div>
    `;

    div.onclick=()=>{
      openItem(i);
    };

    results.appendChild(div);

  });

  results.style.display="block";

}

function openItem(i){

  current=i;

  itemBox.classList.add("active");

  itemName.textContent=i.name;

  const p = city.value==="Barcelona" ? i.barca : i.madrid;

  const sell = city.value==="Barcelona" ? i.sellB : i.sellM;

  price.textContent="Price: "+money(p);

  vat.textContent="With VAT: "+money(p*(1+VAT));

  unit.textContent="Quantity Type: "+i.unit;

  recommended.textContent=money(sell);

  results.style.display="none";

}

search.addEventListener("input",showResults);

city.addEventListener("change",()=>{
  if(current){
    openItem(current);
  }
});

document.getElementById("addBtn").onclick=()=>{

  if(!current)return;

  const q = parseInt(qty.value)||1;

  const p = city.value==="Barcelona" ? current.barca : current.madrid;

  cart.push({
    name:current.name,
    qty:q,
    price:p
  });

  renderCart();

};

function renderCart(){

  cartDiv.innerHTML="";

  let subtotal=0;

  cart.forEach((c,index)=>{

    const line = c.qty*c.price;

    subtotal += line;

    const div = document.createElement("div");

    div.className="cart-item";

    div.innerHTML=`
      <div class="cart-item-name">${c.name}</div>
      <div class="cart-item-meta">
        ${c.qty} × ${money(c.price)}
      </div>
      <div style="margin-top:8px;font-weight:700;">
        ${money(line)}
      </div>
    `;

    cartDiv.appendChild(div);

  });

  const vatAmount=subtotal*VAT;

  document.getElementById("subtotal").textContent=money(subtotal);

  document.getElementById("vatTotal").textContent=money(vatAmount);

  document.getElementById("grand").textContent=money(subtotal+vatAmount);

}

</script>

</body>
</html>
