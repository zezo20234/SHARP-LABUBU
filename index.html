l<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft City Market</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
padding:20px;
}

h1{
text-align:center;
margin-bottom:20px;
}

.topbar{
display:flex;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;
}

input,select{
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
}

#search{
flex:1;
min-width:250px;
}

.container{
display:grid;
grid-template-columns:1fr 350px;
gap:20px;
}

@media(max-width:900px){
.container{
grid-template-columns:1fr;
}
}

.card{
background:#1e293b;
padding:20px;
border-radius:18px;
box-shadow:0 0 15px rgba(0,0,0,0.3);
position:relative;
z-index:1;
}

.price{
color:#22c55e;
font-weight:bold;
}

.small{
color:#94a3b8;
margin-top:10px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px 18px;
border-radius:10px;
cursor:pointer;
margin-top:10px;
font-size:15px;
}

button:hover{
background:#1d4ed8;
}

.suggestions{
position:absolute;
background:#1e293b;
width:100%;
border-radius:12px;
overflow:hidden;
margin-top:5px;
z-index:9999;
box-shadow:0 0 20px rgba(0,0,0,0.4);
max-height:300px;
overflow-y:auto;
}

.suggestion{
padding:12px;
cursor:pointer;
border-bottom:1px solid #334155;
}

.suggestion:hover{
background:#334155;
}

.cart-item{
border-bottom:1px solid #334155;
padding:10px 0;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.remove{
background:#dc2626;
padding:8px 10px;
font-size:13px;
}

.remove:hover{
background:#b91c1c;
}

.total{
margin-top:20px;
font-size:24px;
color:#22c55e;
font-weight:bold;
}

.qty{
width:100px;
margin-top:10px;
}

</style>
</head>
<body>

<h1>🏙️ Minecraft Barcelona & Madrid Market</h1>

<div class="topbar">

<div style="position:relative; flex:1;">

<input type="text" id="search" placeholder="Search item...">

<div class="suggestions" id="suggestions"></div>

</div>

<select id="city">
<option value="Barcelona">Barcelona</option>
<option value="Madrid">Madrid</option>
</select>

</div>

<div class="container">

<div>

<div class="card" id="itemCard">

<h2>Search for an item</h2>
<p class="small">
Type something like "dia", "bread", "stone", etc.
</p>

</div>

</div>

<div class="card">

<h2>🛒 Cart</h2>

<div id="cart"></div>

<div class="total" id="total">
Total: 0€
</div>

</div>

</div>

<script>

const VAT = 0.10;

const items = [

{
name:"Bread",
quantity:"1 Bread",
barca:1,
madrid:0.7,
sellBarca:2,
sellMadrid:1
},

{
name:"Steak",
quantity:"1 Steak",
barca:5,
madrid:4,
sellBarca:8,
sellMadrid:6
},

{
name:"Cooked Chicken",
quantity:"1 Chicken",
barca:4,
madrid:3,
sellBarca:6,
sellMadrid:5
},

{
name:"Potato",
quantity:"1 Potato",
barca:1,
madrid:0.5,
sellBarca:2,
sellMadrid:1
},

{
name:"Apple",
quantity:"1 Apple",
barca:2,
madrid:1,
sellBarca:3,
sellMadrid:2
},

{
name:"Cake",
quantity:"1 Cake",
barca:15,
madrid:12,
sellBarca:20,
sellMadrid:16
},

{
name:"Concrete",
quantity:"64 Blocks",
barca:8,
madrid:6,
sellBarca:12,
sellMadrid:9
},

{
name:"Stone",
quantity:"64 Blocks",
barca:4,
madrid:3,
sellBarca:6,
sellMadrid:5
},

{
name:"Cobblestone",
quantity:"64 Blocks",
barca:3,
madrid:2,
sellBarca:5,
sellMadrid:4
},

{
name:"Glass",
quantity:"64 Blocks",
barca:12,
madrid:10,
sellBarca:16,
sellMadrid:13
},

{
name:"Oak Planks",
quantity:"64 Blocks",
barca:6,
madrid:5,
sellBarca:9,
sellMadrid:7
},

{
name:"Diamond",
quantity:"1 Diamond",
barca:35,
madrid:28,
sellBarca:50,
sellMadrid:40
},

{
name:"Diamond Block",
quantity:"1 Block",
barca:300,
madrid:250,
sellBarca:380,
sellMadrid:320
},

{
name:"Iron Ingot",
quantity:"1 Ingot",
barca:5,
madrid:4,
sellBarca:8,
sellMadrid:6
},

{
name:"Gold Ingot",
quantity:"1 Ingot",
barca:8,
madrid:6,
sellBarca:12,
sellMadrid:10
},

{
name:"Netherite Ingot",
quantity:"1 Ingot",
barca:200,
madrid:170,
sellBarca:260,
sellMadrid:220
},

{
name:"Rail",
quantity:"64 Rails",
barca:20,
madrid:16,
sellBarca:28,
sellMadrid:22
},

{
name:"Powered Rail",
quantity:"32 Rails",
barca:30,
madrid:25,
sellBarca:40,
sellMadrid:32
},

{
name:"Minecart",
quantity:"1 Minecart",
barca:10,
madrid:8,
sellBarca:15,
sellMadrid:12
},

{
name:"Torch",
quantity:"64 Torches",
barca:4,
madrid:3,
sellBarca:6,
sellMadrid:5
},

{
name:"Lantern",
quantity:"1 Lantern",
barca:6,
madrid:5,
sellBarca:9,
sellMadrid:7
},

{
name:"Furnace",
quantity:"1 Furnace",
barca:5,
madrid:4,
sellBarca:8,
sellMadrid:6
},

{
name:"Chest",
quantity:"1 Chest",
barca:4,
madrid:3,
sellBarca:6,
sellMadrid:5
},

{
name:"Bed",
quantity:"1 Bed",
barca:10,
madrid:8,
sellBarca:14,
sellMadrid:11
}

];

const search = document.getElementById("search");
const suggestions = document.getElementById("suggestions");
const itemCard = document.getElementById("itemCard");
const citySelect = document.getElementById("city");
const cartDiv = document.getElementById("cart");
const totalDiv = document.getElementById("total");

let currentItem = null;
let cart = [];

search.addEventListener("input", ()=>{

const value = search.value.toLowerCase();

suggestions.innerHTML = "";

if(!value) return;

const filtered = items.filter(item =>
item.name.toLowerCase().includes(value)
);

filtered.forEach(item=>{

const div = document.createElement("div");

div.className = "suggestion";

div.innerHTML = `
${item.name}
`;

div.onclick = ()=>{

showItem(item);

search.value = item.name;

suggestions.innerHTML = "";

};

suggestions.appendChild(div);

});

});

function showItem(item){

currentItem = item;

const city = citySelect.value;

const basePrice =
city === "Barcelona"
? item.barca
: item.madrid;

const vatPrice =
(basePrice * (1 + VAT)).toFixed(2);

itemCard.innerHTML = `

<h2>${item.name}</h2>

<p class="small">
Quantity:
<b>${item.quantity}</b>
</p>

<br>

<p>
Original Price:
<span class="price">
${basePrice}€
</span>
</p>

<br>

<p>
Price With VAT:
<span class="price">
${vatPrice}€
</span>
</p>

<br>

<p>
🏙️ Barcelona Recommended Selling Price:
<span class="price">
${item.sellBarca}€
</span>
</p>

<br>

<p>
🌾 Madrid Recommended Selling Price:
<span class="price">
${item.sellMadrid}€
</span>
</p>

<br>

<label>Quantity:</label>

<br>

<input
type="number"
id="qty"
class="qty"
min="1"
value="1"
>

<br>

<button onclick="addToCart()">
Add To Cart
</button>

`;

}

function addToCart(){

if(!currentItem) return;

const qty =
parseInt(document.getElementById("qty").value);

const city = citySelect.value;

const price =
city === "Barcelona"
? currentItem.barca
: currentItem.madrid;

const final =
(price * (1 + VAT)) * qty;

cart.push({

name:currentItem.name,
qty:qty,
total:final

});

renderCart();

}

function renderCart(){

cartDiv.innerHTML = "";

let total = 0;

cart.forEach((item,index)=>{

total += item.total;

const div = document.createElement("div");

div.className = "cart-item";

div.innerHTML = `

<div>
<b>${item.name}</b>
<br>
x${item.qty}
<br>
<span class="price">
${item.total.toFixed(2)}€
</span>
</div>

<button
class="remove"
onclick="removeItem(${index})"
>
Remove
</button>

`;

cartDiv.appendChild(div);

});

totalDiv.innerHTML = `
Total:
${total.toFixed(2)}€
`;

}

function removeItem(index){

cart.splice(index,1);

renderCart();

}

</script>

</body>
</html>
