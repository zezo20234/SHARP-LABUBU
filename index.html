<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <style>
        /* Modern CSS Reset & Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .container {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 15px;
            font-size: 1.5em;
        }

        /* Products Section */
        .product {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #f0f3f4;
        }

        .product:last-child {
            border-bottom: none;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s ease-in-out;
        }

        button:hover {
            background-color: #2980b9;
        }

        /* Cart Section */
        .cart-item {
            display: flex;
            flex-direction: column;
            padding: 15px 0;
            border-bottom: 1px solid #f0f3f4;
            gap: 12px;
        }

        .cart-item-header {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            color: #2c3e50;
        }

        .cart-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
            color: #7f8c8d;
        }

        .quantity-control input {
            width: 60px;
            padding: 6px;
            text-align: center;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-family: inherit;
        }

        .remove-btn {
            background-color: #e74c3c;
            font-size: 0.85em;
            padding: 6px 12px;
        }

        .remove-btn:hover {
            background-color: #c0392b;
        }

        /* Totals Section */
        .totals {
            margin-top: 25px;
            background: #fafbfc;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ecf0f1;
        }

        .totals-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #7f8c8d;
        }

        .grand-total {
            font-size: 1.25em;
            font-weight: bold;
            color: #2c3e50;
            border-top: 2px solid #bdc3c7;
            padding-top: 15px;
            margin-top: 10px;
        }

        .empty-cart {
            text-align: center;
            color: #95a5a6;
            font-style: italic;
            padding: 30px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Store Catalog</h2>
        <div class="product">
            <span>Wireless Mouse ($25.00)</span>
            <button onclick="addToCart(1, 'Wireless Mouse', 25.00)">Add to Cart</button>
        </div>
        <div class="product">
            <span>Mechanical Keyboard ($75.00)</span>
            <button onclick="addToCart(2, 'Mechanical Keyboard', 75.00)">Add to Cart</button>
        </div>
        <div class="product">
            <span>USB-C Hub ($40.00)</span>
            <button onclick="addToCart(3, 'USB-C Hub', 40.00)">Add to Cart</button>
        </div>
    </div>

    <div class="container">
        <h2>Your Cart</h2>
        <div id="cart-items">
            <div class="empty-cart">Your cart is currently empty.</div>
        </div>

        <div class="totals" id="cart-totals" style="display: none;">
            <div class="totals-row">
                <span>Subtotal:</span>
                <span id="subtotal">$0.00</span>
            </div>
            <div class="totals-row">
                <span>VAT (10%):</span>
                <span id="vat">$0.00</span>
            </div>
            <div class="totals-row grand-total">
                <span>Total:</span>
                <span id="grand-total">$0.00</span>
            </div>
        </div>
    </div>

    <script>
        let cart = [];

        function addToCart(id, name, price) {
            // Check if the item already exists in the cart array
            const existingItem = cart.find(item => item.id === id);
            
            if (existingItem) {
                // If it exists, just increase the quantity
                existingItem.quantity += 1;
            } else {
                // If it's a new item, push it to the array
                cart.push({ id, name, price, quantity: 1 });
            }
            
            updateCartUI();
        }

        function updateQuantity(id, newQuantity) {
            const item = cart.find(item => item.id === id);
            if (item) {
                item.quantity = parseInt(newQuantity);
                // If the user sets the quantity to 0 or a negative number, remove the item entirely
                if (item.quantity <= 0) {
                    removeItem(id);
                } else {
                    updateCartUI();
                }
            }
        }

        function removeItem(id) {
            // Filter out the item that matches the ID we want to remove
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        }

        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cart-items');
            const cartTotalsContainer = document.getElementById('cart-totals');
            
            // Clear current UI to prevent duplicates
            cartItemsContainer.innerHTML = '';

            // Handle empty cart state
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<div class="empty-cart">Your cart is currently empty.</div>';
                cartTotalsContainer.style.display = 'none';
                return;
            }

            let subtotal = 0;

            // Generate HTML for each item in the cart
            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;

                const itemDiv = document.createElement('div');
                itemDiv.className = 'cart-item';
                itemDiv.innerHTML = `
                    <div class="cart-item-header">
                        <span>${item.name}</span>
                        <span>$${itemTotal.toFixed(2)}</span>
                    </div>
                    <div class="cart-controls">
                        <div class="quantity-control">
                            <label for="qty-${item.id}">Qty:</label>
                            <input type="number" id="qty-${item.id}" value="${item.quantity}" min="1" onchange="updateQuantity(${item.id}, this.value)">
                        </div>
                        <button class="remove-btn" onclick="removeItem(${item.id})">Remove</button>
                    </div>
                `;
                cartItemsContainer.appendChild(itemDiv);
            });

            // VAT calculation (10%)
            const vatRate = 0.10; 
            const vatAmount = subtotal * vatRate;
            const grandTotal = subtotal + vatAmount;

            // Update the text for the totals
            document.getElementById('subtotal').innerText = '$' + subtotal.toFixed(2);
            document.getElementById('vat').innerText = '$' + vatAmount.toFixed(2);
            document.getElementById('grand-total').innerText = '$' + grandTotal.toFixed(2);
            
            // Make sure the totals box is visible
            cartTotalsContainer.style.display = 'block';
        }
    </script>
</body>
</html>
